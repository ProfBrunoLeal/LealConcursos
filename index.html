<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leal Concursos – Preparatório para Cefet, FAETEC e pré-militar</title>
<meta name="description" content="Leal Concursos: preparatório presencial para Cefet, FAETEC, ESA, EEAr e Fuzileiros Navais, em Duque de Caxias, com o Prof. Bruno Leal.">
<meta name="theme-color" content="#0f2a6b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
<style>
:root{--bg:#f7f8fc;--card:#fff;--text:#161a26;--muted:#5a6275;--line:#e1e5ee;--accent:#1f4fd8;--hero1:#0f2a6b;--hero2:#1f4fd8;--zap:#12a150;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f121a;--card:#181d28;--text:#eef1f7;--muted:#9aa3b6;--line:#2a3142;--accent:#7aa2ff;--hero1:#0a1636;--hero2:#16339a;--zap:#2fbf71;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f121a;--card:#181d28;--text:#eef1f7;--muted:#9aa3b6;--line:#2a3142;--accent:#7aa2ff;--hero1:#0a1636;--hero2:#16339a;--zap:#2fbf71;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:48px 0 56px}
.logo{font-weight:700;letter-spacing:.02em;margin-bottom:32px}
.logo span{color:#7ee8d2}
h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.12;margin:0 0 14px;max-width:17em}
.hero p{font-size:1.08rem;max-width:36em;opacity:.93;margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.chips span{background:rgba(255,255,255,.15);border-radius:999px;padding:5px 12px;font-size:.88rem}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:13px 22px;border-radius:999px;font-weight:600;text-decoration:none}
.btn.z{background:var(--zap);color:#fff}
.btn.s{border:1.5px solid rgba(255,255,255,.7);color:#fff}
section{padding:44px 0}
h2{font-size:1.55rem;margin:0 0 6px}
.lead{color:var(--muted);max-width:38em;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h3{margin:0 0 4px;font-size:1.08rem}
