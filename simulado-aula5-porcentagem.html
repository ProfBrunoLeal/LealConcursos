<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado – Leal Concursos</title>
<meta name="description" content="Simulado de Matemática (porcentagem) do Leal Concursos, com resolução comentada pelo professor.">
<meta name="theme-color" content="#0f2a6b">
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b1f2a;--muted:#5d6577;--line:#dde1ea;--accent:#2457d6;--ok:#17803d;--okbg:#e5f6ec;--bad:#c0262d;--badbg:#fdeaea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2029;--text:#eceff5;--muted:#9aa3b5;--line:#2c3342;--accent:#7aa2ff;--ok:#5fd08a;--okbg:#14301f;--bad:#ff8a8f;--badbg:#3a1a1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2029;--text:#eceff5;--muted:#9aa3b5;--line:#2c3342;--accent:#7aa2ff;--ok:#5fd08a;--okbg:#14301f;--bad:#ff8a8f;--badbg:#3a1a1c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.15rem;margin:4px 0 2px}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.tag{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.q{font-size:1.05rem;margin:8px 0 14px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input:disabled{opacity:.8}
.btn{padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.full{width:100%;margin-top:14px}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}
.res{font-weight:600;margin-top:14px;padding:10px 12px;border-radius:10px}
.res.ok{background:var(--okbg);color:var(--ok)}
.res.bad{background:var(--badbg);color:var(--bad)}
.sol{margin-top:12px;padding:12px;border-left:4px solid var(--accent);background:var(--bg);border-radius:6px;font-size:.95rem;white-space:pre-line}
[hidden]{display:none}
.big{font-size:2.2rem;font-weight:700;text-align:center;margin:8px 0}
.rev{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
</style>
</head>
<body>
<main>
<a href="index.html" style="color:var(--accent);font-size:.9rem;text-decoration:none">← Voltar ao site</a>
<h1>Simulado – Leal Concursos</h1>
<div class="sub">Matemática · Aula 5 · Porcentagem · Prof. Bruno Leal</div>
<div class="bar"><i id="bar"></i></div>
<div class="card" id="quiz">
  <div class="tag" id="tag"></div>
  <div class="q" id="q"></div>
  <div class="row"><input id="ans" inputmode="decimal" autocomplete="off" placeholder="Digite sua resposta"><button class="btn" id="ok">Responder</button></div>
  <div class="hint" id="hint"></div>
  <div id="fb" hidden>
    <div class="res" id="res"></div>
    <div class="sol" id="sol"></div>
    <button class="btn full" id="next"></button>
  </div>
</div>
<div class="card" id="end" hidden>
  <div class="tag">Resultado</div>
  <div class="big" id="score"></div>
  <div id="review"></div>
  <button class="btn full" id="again">Refazer simulado</button>
</div>
</main>
<script>
// Para trocar ou acrescentar questões, edite apenas esta lista.
// ok: respostas numéricas aceitas · resp: texto da resposta correta · dica: unidade pedida.
const QUESTOES = [
 {fonte:"Professor de Matemática – SC/2023", dica:"Responda em reais.", ok:[80], resp:"R$ 80,00",
  enunciado:"Em uma feira, Maria gastou 40% de todo o dinheiro que tinha em sua carteira. Se o valor gasto por Maria foi de R$ 32,00, então é correto afirmar que o valor total que ela tinha na carteira era de:",
  solucao:"Regra de três:\nR$ → %\n32 → 40\nx → 100\n40x = 32 · 100 → 40x = 3200 → x = 80 reais.\n\nOu: 40% → 32 reais; 10% → 32 ÷ 4 = 8 reais; 100% → 8 × 10 = 80 reais."},
 {fonte:"IBFC/2023", dica:"Responda em reais.", ok:[42], resp:"R$ 42,00",
  enunciado:"Paulo foi a uma loja e pagou R$ 238,00 por um produto, já incluso 15% de desconto sobre o preço do produto exposto na vitrine. Nessas condições, o valor do desconto atribuído ao preço do produto foi de:",
  solucao:"Toda grandeza, ANTES de qualquer aumento ou de qualquer desconto, é o 100% na regra de três.\nR$ → %\n238 → 85 (100% − 15%)\nx → 15\n85x = 238 · 15 → 85x = 3570 → x = 42 reais."},
 {fonte:"IBFC/2023", dica:"Responda em reais.", ok:[12.75], resp:"R$ 12,75",
  enunciado:"Em uma feira local, um quilo do tomate custava R$ 8,50. No fim da feira comprando três quilos de tomates o cliente teria um desconto de 50% no valor. Com o desconto o cliente pagará:",
  solucao:"1) 3 kg de tomate → 3 × 8,50 = 25,50\n2) Com 50% de desconto: 25,50 ÷ 2 = 12,75 reais."},
 {fonte:"IBFC/2024", dica:"Responda com o número de entregadores.", ok:[42], resp:"42 entregadores",
  enunciado:"Em uma cidade, há duas empresas, A e B, que oferecem serviços de entrega de alimentos. Na empresa A, 25% dos entregadores são ciclistas, enquanto que na empresa B, 15% dos entregadores utilizam bicicletas. Se a empresa A possui 120 entregadores e a empresa B tem 80 entregadores, o número total de entregadores que utilizam bicicletas é de:",
  solucao:"1) Empresa A → 25% de 120 = 30\n2) Empresa B → 15% de 80 = 12\nLogo: total → 30 + 12 = 42."},
 {fonte:"IBFC/2024", dica:"Responda com o número de laranjeiras.", ok:[102], resp:"102 laranjeiras",
  enunciado:"Um agricultor plantou uma área retangular de terra com laranjeiras. Ele plantou 8 fileiras de laranjeiras, e em cada fileira, ele plantou 15 laranjeiras espaçadas igualmente. No entanto, devido a uma praga, 15% das laranjeiras morreram. O número de laranjeiras que ainda restaram é de:",
  solucao:"1) Total → 8 × 15 = 120 laranjeiras\n2) Morreram → 15% de 120 = 18\n3) Restaram → 120 – 18 = 102 laranjeiras."},
 {fonte:"IBFC/2024", dica:"Responda em reais.", ok:[1248], resp:"R$ 1.248,00",
  enunciado:"Um smartphone tem um preço inicial de R$ 1.500,00. A taxa de seguro é de 4% sobre o valor do smartphone e os clientes que optam pelo pagamento à vista recebem um desconto de 20% sobre o custo total (inclui o seguro). Se um cliente efetuou o pagamento à vista, ele gastou:",
  solucao:"1) Seguro → 4% de 1.500 = 60\n2) Custo total do smartphone → 1.500 + 60 = 1.560\n3) Desconto → 20% de 1.560 = 312\nLogo: 1.560 – 312 = 1.248 reais."},
 {fonte:"EBSERH – IBFC/2023", dica:"Responda em reais.", ok:[5000], resp:"R$ 5.000,00",
  enunciado:"Se um salário foi aumentado em R$ 500,00, o que corresponde a um aumento de 10% do valor original, o salário antes do aumento era:",
  solucao:"Toda grandeza, ANTES de qualquer aumento ou de qualquer desconto, é o 100% na regra de três.\nR$ → %\n500 → 10\nx → 100\n10x = 50.000 → x = 5.000."},
 {fonte:"IBFC/2024", dica:"Responda em reais.", ok:[100], resp:"R$ 100,00",
  enunciado:"Uma loja vende uma de suas camisetas por R$ 85,00 cada e já com desconto de 15% do valor original. O valor original dessa camiseta é:",
  solucao:"Toda grandeza, ANTES de qualquer aumento ou de qualquer desconto, é o 100% na regra de três.\nR$ → %\n85 → 85 (100% − 15%)\nx → 100\n85x = 8.500 → x = 100."},
 {fonte:"Analista – SAEB – IBFC/2023", dica:"Responda em %.", ok:[28], resp:"28%",
  enunciado:"O preço de um produto na vitrine estava anunciado com 20% de desconto à vista, porém Mariana obteve outro desconto de 10% sobre o valor do produto já descontado os 20%. Nessas condições, o desconto total obtido por Mariana na compra do produto foi de:",
  solucao:"1) Vamos supor o valor inicial do produto = 100 reais\n2) Desconto de 20% de 100 = 20\n3) Valor atual do produto → 100 – 20 = 80\n4) Desconto de 10% de 80 = 8\n5) Logo: 20 + 8 = 28 reais de desconto → 28% de desconto."},
 {fonte:"Professor de Matemática – AC – IBFC/2023", dica:"Responda em %.", ok:[2.4], resp:"2,4%",
  enunciado:"Num aquário 12% dos peixes foram afetados por uma doença. Dos peixes atingidos por essa doença, apenas 20% deles morreram. A porcentagem de peixes que morreu por causa dessa doença é:",
  solucao:"1) Vamos supor que no aquário havia 100 peixes\n2) Doentes → 12% de 100 = 12 peixes\n3) Morreram → 20% de 12 = 2,4 peixes\n→ 2,4% do total."},
 {fonte:"Professor de Matemática – RR – IBFC/2021", dica:"Responda em %.", ok:[4.5], resp:"4,5%",
  enunciado:"Em uma comunidade, 15% das pessoas foram afetadas por uma bactéria. Das pessoas atingidas por essa bactéria, 30% tiveram diarreia em decorrência de uma doença causada por ela. Qual a porcentagem da população que teve diarreia causada por essa bactéria?",
  solucao:"1) Vamos supor que na comunidade havia 100 pessoas\n2) Doentes → 15% de 100 = 15 pessoas\n3) Diarreia → 30% de 15 = 4,5 pessoas\n→ 4,5% do total."},
 {fonte:"Professor de Matemática – Camaçari – BA/2024", dica:"Responda em %, informando o valor da variação do preço.", ok:[13.6,-13.6,86.4], resp:"diminuição de 13,6%",
  enunciado:"No preço P de um determinado produto foram aplicados, em dois meses consecutivos, dois aumentos sucessivos de 20% e, no terceiro mês, um desconto de 40%. Considerando regime de capitalização composto, qual foi a variação do preço final em relação ao valor original P?",
  solucao:"1) Vamos supor o valor inicial P = 100 reais\n2) Aumento de 20% de 100 = 20 → valor atual: 120\n3) Aumento de 20% de 120 = 24 → valor atual: 144\n4) Desconto de 40% de 144 = 57,60 → valor final: 144 – 57,60 = 86,40\nLogo, houve uma diminuição de 100 – 86,40 = 13,60 → 13,6%."},
 {fonte:"Professor de Matemática – SC/2024", dica:"Responda em %.", ok:[54], resp:"54%",
  enunciado:"Luan fez um reservatório para água da chuva e uma caixa plástica e colocou uma torneira de escape. Em um dia de temporal foram ocupados 72% do volume total do reservatório, mas no outro dia Luan percebeu que havia deixado a torneira um pouco aberta e por isso perdeu 25% da água que havia captado. Qual era o percentual da capacidade total que havia no reservatório naquele momento?",
  solucao:"1) Vamos supor que a caixa inteira = 100 litros\n2) Captados: 72% de 100 litros = 72 litros\n3) Perdeu: 25% de 72 = 18 litros\nLogo: 72 – 18 = 54 litros → 54% do total."}
];
let i=0, acertos=0, certas=[];
const $=id=>document.getElementById(id);
function num(s){
  s=s.toLowerCase().replace(/r\$|%|reais|\s/g,"");
  if(s.indexOf(",")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const n=parseFloat(s); return isNaN(n)?null:n;
}
function mostrar(){
  const q=QUESTOES[i];
  $("bar").style.width=(i/QUESTOES.length*100)+"%";
  $("tag").textContent="Questão "+(i+1)+" de "+QUESTOES.length+" · "+q.fonte;
  $("q").textContent=q.enunciado;
  $("hint").textContent=q.dica;
  $("ans").value=""; $("ans").disabled=false; $("ok").disabled=false;
  $("fb").hidden=true; $("ans").focus();
}
function responder(){
  const q=QUESTOES[i], v=num($("ans").value);
  if(v===null){ $("hint").textContent="Digite um número para responder."; return; }
  const certo=q.ok.some(x=>Math.abs(x-v)<0.005);
  certas[i]=certo; if(certo) acertos++;
  $("ans").disabled=true; $("ok").disabled=true;
  $("res").className="res "+(certo?"ok":"bad");
  $("res").textContent=certo?"✓ Resposta correta!":"✗ Incorreta. A resposta correta é: "+q.resp+".";
  $("sol").textContent="Resolução do professor:\n"+q.solucao;
  $("next").textContent=i<QUESTOES.length-1?"Próxima questão":"Ver resultado";
  $("fb").hidden=false;
}
function fim(){
  $("bar").style.width="100%";
  $("quiz").hidden=true; $("end").hidden=false;
  $("score").textContent=acertos+" / "+QUESTOES.length;
  const r=$("review"); r.innerHTML="";
  QUESTOES.forEach((q,n)=>{
    const d=document.createElement("div"); d.className="rev";
    const a=document.createElement("span"); a.textContent="Questão "+(n+1);
    const b=document.createElement("span"); b.textContent=certas[n]?"✓ acertou":"✗ era "+q.resp;
    b.style.color=certas[n]?"var(--ok)":"var(--bad)";
    d.append(a,b); r.appendChild(d);
  });
}
$("ok").onclick=responder;
$("ans").addEventListener("keydown",e=>{ if(e.key==="Enter" && !$("ans").disabled) responder(); });
$("next").onclick=()=>{ if(i<QUESTOES.length-1){ i++; mostrar(); } else fim(); };
$("again").onclick=()=>{ i=0; acertos=0; certas=[]; $("end").hidden=true; $("quiz").hidden=false; mostrar(); };
mostrar();
</script>
</body>
</html>
